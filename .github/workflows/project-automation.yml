name: Project Automation

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  pull_request_target: # 只读取默认分支的可信脚本，不执行 PR head。
    types: [opened, edited, labeled, unlabeled, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      item_type:
        description: 需要重新同步的条目类型
        required: true
        type: choice
        options: [issue, pull_request]
      number:
        description: 此仓库已有的 Issue 或 PR 编号；留空仅验证 Project 配置
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.number || 'configuration' }}
  cancel-in-progress: false

jobs:
  synchronize:
    name: Project Item and Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 添加条目并同步状态
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: node .github/scripts/automation.js project
